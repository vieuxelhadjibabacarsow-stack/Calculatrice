<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Calculatrice</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gray-600 flex items-center justify-center p-4 md:p-8">

    <div class="bg-neutral-950 border-2 border-yellow-400 p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-sm md:w-[460px] md:max-w-none">

        <h1 class="text-yellow-400 text-2xl md:text-3xl font-extrabold tracking-wide text-center mb-6 md:mb-8">
            Calculatrice
        </h1>

        <!-- Écran -->
        <div class="bg-gray-700 border border-neutral-800 p-5 md:p-6 rounded-2xl mb-6 md:mb-8">
            <div id="previous" class="text-yellow-400 text-right text-sm md:text-base font-medium min-h-6"></div>
            <div id="display" class="text-lime-300 text-right text-4xl md:text-6xl font-extrabold tracking-tight overflow-hidden">
                0
            </div>
        </div>

        <!-- Boutons -->
        <div class="grid grid-cols-4 gap-3 md:gap-4">

            <button data-action="clear" class="bg-red-600 text-white p-4 md:p-5 text-lg md:text-xl font-bold rounded-2xl">AC</button>
            <button data-action="delete" class="bg-red-600 text-white p-4 md:p-5 text-lg md:text-xl font-bold rounded-2xl">DEL</button>
            <button data-action="percent" class="bg-yellow-400 text-black p-4 md:p-5 text-lg md:text-xl font-extrabold rounded-2xl">%</button>
            <button data-operator="/" class="bg-yellow-400 text-black p-4 md:p-5 text-xl md:text-2xl font-extrabold rounded-2xl">÷</button>

            <button data-number="7" class="bg-neutral-900 border border-neutral-800 text-lime-300 p-4 md:p-5 text-xl md:text-2xl font-bold rounded-2xl">7</button>
            <button data-number="8" class="bg-neutral-900 border border-neutral-800 text-lime-300 p-4 md:p-5 text-xl md:text-2xl font-bold rounded-2xl">8</button>
            <button data-number="9" class="bg-neutral-900 border border-neutral-800 text-lime-300 p-4 md:p-5 text-xl md:text-2xl font-bold rounded-2xl">9</button>
            <button data-operator="*" class="bg-yellow-400 text-black p-4 md:p-5 text-xl md:text-2xl font-extrabold rounded-2xl">×</button>

            <button data-number="4" class="bg-neutral-900 border border-neutral-800 text-lime-300 p-4 md:p-5 text-xl md:text-2xl font-bold rounded-2xl">4</button>
            <button data-number="5" class="bg-neutral-900 border border-neutral-800 text-lime-300 p-4 md:p-5 text-xl md:text-2xl font-bold rounded-2xl">5</button>
            <button data-number="6" class="bg-neutral-900 border border-neutral-800 text-lime-300 p-4 md:p-5 text-xl md:text-2xl font-bold rounded-2xl">6</button>
            <button data-operator="-" class="bg-yellow-400 text-black p-4 md:p-5 text-xl md:text-2xl font-extrabold rounded-2xl">−</button>

            <button data-number="1" class="bg-neutral-900 border border-neutral-800 text-lime-300 p-4 md:p-5 text-xl md:text-2xl font-bold rounded-2xl">1</button>
            <button data-number="2" class="bg-neutral-900 border border-neutral-800 text-lime-300 p-4 md:p-5 text-xl md:text-2xl font-bold rounded-2xl">2</button>
            <button data-number="3" class="bg-neutral-900 border border-neutral-800 text-lime-300 p-4 md:p-5 text-xl md:text-2xl font-bold rounded-2xl">3</button>
            <button data-operator="+" class="bg-yellow-400 text-black p-4 md:p-5 text-xl md:text-2xl font-extrabold rounded-2xl">+</button>

            <button data-number="0" class="bg-neutral-900 border border-neutral-800 text-lime-300 p-4 md:p-5 text-xl md:text-2xl font-bold rounded-2xl col-span-2">0</button>
            <button data-action="decimal" class="bg-neutral-900 border border-neutral-800 text-lime-300 p-4 md:p-5 text-xl md:text-2xl font-bold rounded-2xl">.</button>
            <button data-action="equals" class="bg-lime-300 text-black p-4 md:p-5 text-xl md:text-2xl font-extrabold rounded-2xl">=</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
